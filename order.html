<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Body Scent</title>
  <meta name="description" content="กรอกข้อมูลเพื่อสั่งซื้อสินค้าจาก Body Scent">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+Thai:wght@300;400;500&family=Noto+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    /* Page-specific additions for order.html (can be moved into style.css) */
    body { display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; }
    .page-title { font-size: var(--step-3); line-height: 1.5; }

    .order-form { max-width: 34rem; }
    .order-form textarea { resize: vertical; line-height: 1.7; }
    .field__hint {
      display: block;
      margin-top: 0.4rem;
      font-size: var(--step--1);
      color: var(--bronze-deep);
    }
    .order-form .btn { margin-top: var(--space-2); }

    .btn:disabled,
    .btn:disabled:hover {
      opacity: 0.45;
      cursor: not-allowed;
      background: transparent;
      color: var(--bronze-deep);
      border-color: var(--bronze);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section__head">
          <h1 class="page-title">สั่งซื้อสินค้า</h1>
          <p>กรอกข้อมูลด้านล่างเพื่อยืนยันคำสั่งซื้อ อยากเลือกสินค้าเพิ่ม ดูได้ที่<a href="product.html">หน้าสินค้า</a></p>
        </div>

        <form id="orderForm" class="order-form">
          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" placeholder="เบอร์โทรศัพท์ หรือ Line ID" required>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <textarea id="items" name="items" rows="2" required></textarea>
            <span class="field__hint">สั่งหลายรายการได้ พิมพ์ต่อท้ายในช่องนี้</span>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" inputmode="decimal" required>
            <span class="field__hint">แก้ไขได้ หากสั่งหลายรายการ</span>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note" rows="3" placeholder="ที่อยู่จัดส่ง หรือข้อความถึงร้าน (ไม่บังคับ)"></textarea>
          </div>

          <button type="submit" class="btn btn--bronze">ยืนยันสั่งซื้อ</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="site-footer__inner">
        <a class="brand" href="index.html">Body Scent</a>
        <nav class="nav" aria-label="เมนูท้ายเว็บ">
          <a href="index.html">หน้าแรก</a>
          <a href="product.html">สินค้า</a>
        </nav>
      </div>
      <hr>
      <p class="mb-0">© 2026 Body Scent</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
